# This workflow builds a Go binary and deploys it to a Linux VM on push to main.
#
# !! REQUIRES GITHUB SECRETS !!
# Before this works, you MUST add the following secrets to your repository
# (Settings > Secrets and variables > Actions):
#
# 1. VM_HOST: The IP address or DNS name of your Linux VM.
#    Example: 123.45.67.89
#
# 2. VM_USER: The username to log in with (e.g., "ubuntu", "admin").
#    Example: ubuntu
#
# 3. VM_SSH_KEY: The private SSH key (NOT the public key) that has access
#    to your VM.
#    Example: -----BEGIN OPENSSH PRIVATE KEY-----...
#
# 4. VM_DEST_PATH: The *full* destination path for the binary on your VM.
#    Example: /home/ubuntu/my-go-app/my-binary
#
name: Build and Deploy Go App

# Trigger the workflow on push events to the "main" branch
on:
  push:
    branches:
      - main

jobs:
  build:
    # Run the build job on the latest GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go Binary
        run: GOOS=linux GOARCH=amd64 go build -v -o discordbot .

      # Step 4: Upload the built binary as an artifact
      # This makes the "my-app-binary" file available to other jobs (like 'deploy')
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-binary
          path: discordbot

  deploy:
    # Run the deploy job on the latest GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest
    
    # This job depends on the "build" job finishing successfully
    needs: build

    steps:
      # Step 1: Download the binary artifact from the "build" job
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: go-binary

      # Step 2: Make the downloaded binary executable
      - name: Make binary executable
        run: chmod +x discordbot

      # Step 3: Load SSH key into agent
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      # Step 4: Add VM host key to known_hosts
      - name: Add VM to known hosts
        run: ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy binary to VM via scp
        run: |
          scp -v ./discordbot ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/discordbot.tmp

      - name: Restart application on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
          echo "Placing new binary..."
          sudo rm -f ${{ secrets.VM_DEST_PATH }}/discordBot
          sudo mv ~/discordbot.tmp ${{ secrets.VM_DEST_PATH }}/discordBot
          sudo chmod +x ${{ secrets.VM_DEST_PATH }}/discordBot
          echo "Restarting service..."
          sudo systemctl restart goafbot.service
          echo "Deployment complete."
          '
